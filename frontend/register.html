<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register – CareerStack</title>
    <meta name="description"
        content="Create your CareerStack account and start your skill development journey today." />
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js" defer></script>
</head>

<body>

    <div class="auth-wrap">
        <button id="themeToggle" aria-label="Toggle theme"
            style="position:fixed;top:18px;right:22px;z-index:999;">🌙</button>

        <div class="auth-card" style="max-width:460px;">
            <a href="index.html" class="logo">
                <div class="logo-icon">🚀</div>
                <span class="gradient-text">CareerStack</span>
            </a>

            <h2>Create Account</h2>
            <p class="auth-sub">Join thousands building their dream career</p>

            <div id="regAlert" class="alert" style="display:none;"></div>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="regFirstName">First Name</label>
                        <input type="text" id="regFirstName" class="form-control" placeholder="John" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regLastName">Last Name</label>
                        <input type="text" id="regLastName" class="form-control" placeholder="Doe" required />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="regRole">Career Goal</label>
                    <select id="regRole" class="form-control">
                        <option value="">-- Select your target role --</option>
                        <option>Cybersecurity Analyst</option>
                        <option>AI / ML Engineer</option>
                        <option>Data Scientist</option>
                        <option>Cloud Engineer</option>
                        <option>Full Stack Developer</option>
                        <option>Blockchain Developer</option>
                        <option>DevOps Engineer</option>
                        <option>Mobile App Developer</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Min 8 characters"
                        minlength="8" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="regConfirm">Confirm Password</label>
                    <input type="password" id="regConfirm" class="form-control" placeholder="Repeat password"
                        required />
                </div>

                <div style="margin-bottom:18px;">
                    <label
                        style="display:flex;align-items:flex-start;gap:8px;font-size:.82rem;color:var(--text-secondary);cursor:pointer;">
                        <input type="checkbox" id="agreeTerms" style="accent-color:var(--accent-1);margin-top:3px;"
                            required />
                        I agree to the <a href="#" style="color:var(--accent-1);">Terms of Service</a> and <a href="#"
                            style="color:var(--accent-1);">Privacy Policy</a>
                    </label>
                </div>

                <div id="strengthBar" style="margin-bottom:16px;display:none;">
                    <div style="font-size:.75rem;color:var(--text-muted);margin-bottom:4px;">Password strength: <span
                            id="strengthLabel"></span></div>
                    <div class="progress-wrap" style="height:6px;">
                        <div class="progress-fill" id="strengthFill"
                            style="width:0%;transition:width .3s,background .3s;"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width:100%;justify-content:center;padding:13px;font-size:1rem;">
                    Create My Account
                </button>
            </form>

            <p class="auth-link">Already have an account? <a href="login.html">Login →</a></p>
            <p class="auth-link" style="margin-top:6px;"><a href="index.html">← Back to Home</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('regPassword').addEventListener('input', function () {
            const pw = this.value;
            const bar = document.getElementById('strengthBar');
            const fill = document.getElementById('strengthFill');
            const label = document.getElementById('strengthLabel');

            if (!pw) {
                bar.style.display = 'none';
                return;
            }

            bar.style.display = 'block';

            let score = 0;
            if (pw.length >= 8) score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;

            const levels = [
                { w: '25%', color: 'var(--accent-5)', text: 'Weak' },
                { w: '50%', color: 'var(--accent-4)', text: 'Fair' },
                { w: '75%', color: 'var(--accent-1)', text: 'Good' },
                { w: '100%', color: 'var(--accent-3)', text: 'Strong' }
            ];

            const lvl = levels[score - 1] || levels[0];
            fill.style.width = lvl.w;
            fill.style.background = lvl.color;
            label.textContent = lvl.text;
            label.style.color = lvl.color;
        });

        const alertEl = document.getElementById('regAlert');

        function showAlert(type, message) {
            alertEl.className = `alert ${type}`;
            alertEl.textContent = message;
            alertEl.style.display = 'block';
        }

        function hideAlert() {
            alertEl.style.display = 'none';
            alertEl.textContent = '';
        }

        (async function () {
            const token = localStorage.getItem('cs_token');
            if (!token) return;

            try {
                const user = await Auth.fetchMe();
                if (user.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'user-dashboard.html';
                }
            } catch (error) {
                Auth.clearSession();
            }
        })();

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideAlert();

            const first = document.getElementById('regFirstName').value.trim();
            const last = document.getElementById('regLastName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;

            if (password !== confirm) {
                showAlert('alert-danger', 'Passwords do not match.');
                return;
            }

            if (password.length < 6) {
                showAlert('alert-warning', 'Password must be at least 6 characters.');
                return;
            }

            const fullName = `${first} ${last}`.trim();

            try {
                const data = await Auth.register({
                    name: fullName,
                    email,
                    password
                });

                showAlert('alert-success', `Account created! Welcome, ${data.user.name}. Redirecting...`);

                setTimeout(() => {
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'user-dashboard.html';
                    }
                }, 1000);

            } catch (error) {
                showAlert('alert-warning', error.message || 'Registration failed.');
            }
        });
    </script>
</body>

</html>
