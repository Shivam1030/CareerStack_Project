<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – CareerStack</title>
    <meta name="description" content="Log in to your CareerStack account to track skills, income, and career growth." />
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js" defer></script>
</head>

<body>

    <div class="auth-wrap">
        <button id="themeToggle" aria-label="Toggle theme"
            style="position:fixed;top:18px;right:22px;z-index:999;">🌙</button>

        <div class="auth-card">
            <a href="index.html" class="logo">
                <div class="logo-icon">🚀</div>
                <span class="gradient-text">CareerStack</span>
            </a>

            <h2>Welcome Back</h2>
            <p class="auth-sub">Log in to continue your career journey</p>

            <div id="loginAlert" class="alert" style="display:none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password"
                        required />
                </div>

                <div
                    style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:.83rem;">
                    <label style="display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--text-secondary);">
                        <input type="checkbox" id="rememberMe" style="accent-color:var(--accent-1)" /> Remember me
                    </label>
                    <a href="#" style="color:var(--accent-1);">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width:100%;justify-content:center;padding:13px;font-size:1rem;">
                    Login to CareerStack
                </button>
            </form>

            <div class="divider">or continue with</div>

            <div style="display:flex;gap:10px;">
                <button class="btn btn-outline" style="flex:1;justify-content:center;" onclick="socialLogin('Google')">
                    Google
                </button>
                <button class="btn btn-outline" style="flex:1;justify-content:center;" onclick="socialLogin('GitHub')">
                    GitHub
                </button>
            </div>

            <p class="auth-link">Don't have an account? <a href="register.html">Sign up free →</a></p>
            <p class="auth-link" style="margin-top:6px;"><a href="index.html">← Back to Home</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const alertBox = document.getElementById('loginAlert');

        function showAlert(type, message) {
            alertBox.className = `alert ${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            alertBox.style.display = 'none';
            alertBox.textContent = '';
        }

        (async function () {
            const token = localStorage.getItem('cs_token');
            if (!token) return;

            try {
                const user = await Auth.fetchMe();
                if (user.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'user-dashboard.html';
                }
            } catch (error) {
                Auth.clearSession();
            }
        })();

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideAlert();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            try {
                const data = await Auth.login({ email, password });

                showAlert('alert-success', `Welcome back, ${data.user.name}! Redirecting...`);

                setTimeout(() => {
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'user-dashboard.html';
                    }
                }, 900);

            } catch (error) {
                showAlert('alert-danger', error.message || 'Invalid email or password. Please try again.');
            }
        });

        function socialLogin(provider) {
            showAlert('alert-info', `${provider} login will be available once backend OAuth is added.`);
        }
    </script>
</body>

</html>
